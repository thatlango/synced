name: Synced Android Release

on:
  workflow_dispatch:
  push:
    tags: ['synced-v*']

permissions:
  contents: read

jobs:
  signed-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager 'platform-tools' 'platforms;android-37.1' 'build-tools;36.0.0'
      - name: Restore upload keystore
        working-directory: mobile
        env:
          KEYSTORE_B64: ${{ secrets.SYNCED_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > synced-upload-key.jks
      - name: Build signed APK and AAB
        working-directory: mobile
        env:
          SYNCED_ANDROID_KEYSTORE_FILE: synced-upload-key.jks
          SYNCED_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SYNCED_ANDROID_KEYSTORE_PASSWORD }}
          SYNCED_ANDROID_KEY_ALIAS: ${{ secrets.SYNCED_ANDROID_KEY_ALIAS }}
          SYNCED_ANDROID_KEY_PASSWORD: ${{ secrets.SYNCED_ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon lintVitalRelease assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: synced-signed-release
          path: |
            mobile/app/build/outputs/apk/release/app-release.apk
            mobile/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
