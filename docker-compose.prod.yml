services:
  synced-postgres:
    image: postgres:17-alpine
    container_name: synced-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synced}
      POSTGRES_USER: ${POSTGRES_USER:-synced_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - synced_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synced_app} -d ${POSTGRES_DB:-synced}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [synced-internal]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 768m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  synced-redis:
    image: redis:7-alpine
    container_name: synced-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - synced_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [synced-internal]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  synced-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synced-api
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      synced-postgres: { condition: service_healthy }
      synced-redis: { condition: service_healthy }
    expose: ["3000"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/v1/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks: [synced-internal, tuku-edge]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 384
    mem_limit: 1024m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  synced_pgdata:
  synced_redisdata:

networks:
  synced-internal:
    driver: bridge
  tuku-edge:
    external: true
